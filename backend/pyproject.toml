[project]
name = "logpulse-backend"
version = "0.1.0"
description = "LogPulse FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115.0,<1.0.0",
	"uvicorn[standard]>=0.30.0,<1.0.0",
	"pydantic-settings>=2.6.0,<3.0.0",
	"sqlalchemy>=2.0.35,<3.0.0",
	"psycopg[binary]>=3.2.0,<4.0.0",
	"kafka-python>=2.0.2,<3.0.0",
	"httpx>=0.28.1",
	"pytest<=9.0.3",
	"pyspark>=3.5.0,<4.1.1",
	"scikit-learn>=1.6.0,<2.0.0",
	"langchain>=1.2.15",
	"langchain-openai>=1.1.13",
	"langchain-google-genai>=4.2.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0,<1.0.0"]

[project.scripts]
logpulse-backend = "main:main"
logpulse-api = "main:main"
logpulse-runner = "app.runner:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

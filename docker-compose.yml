services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logpulse
      POSTGRES_USER: logpulse
      POSTGRES_PASSWORD: logpulse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - kafka
      - postgres
      - redis
      - elasticsearch
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: LogPulse API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://logpulse:logpulse@postgres:5432/logpulse
      ENABLE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_LOGS_RAW: logs.raw
      KAFKA_CONSUMER_GROUP: logpulse-stream-local
      KAFKA_POLL_TIMEOUT_MS: 1000
      LOG_BUFFER_SIZE: 500
      BATCH_INTERVAL_SECONDS: 900
      BATCH_WINDOW_EVENTS: 1200
      BATCH_USE_PYSPARK: "true"
      BATCH_RUN_LOOP: "false"
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv sync &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  backend-stream:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - kafka
      - postgres
      - redis
      - elasticsearch
    volumes:
      - ./backend:/app
    environment:
      APP_NAME: LogPulse API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://logpulse:logpulse@postgres:5432/logpulse
      ENABLE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_LOGS_RAW: logs.raw
      KAFKA_CONSUMER_GROUP: logpulse-stream-local
      KAFKA_POLL_TIMEOUT_MS: 1000
      LOG_BUFFER_SIZE: 500
      BATCH_INTERVAL_SECONDS: 900
      BATCH_WINDOW_EVENTS: 1200
      BATCH_USE_PYSPARK: "true"
      BATCH_RUN_LOOP: "false"
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv sync &&
      uv run logpulse-runner --mode stream"

  backend-batch:
    profiles: ["batch"]
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - kafka
      - postgres
      - redis
      - elasticsearch
    volumes:
      - ./backend:/app
    environment:
      APP_NAME: LogPulse API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://logpulse:logpulse@postgres:5432/logpulse
      ENABLE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_LOGS_RAW: logs.raw
      KAFKA_CONSUMER_GROUP: logpulse-stream-local
      KAFKA_POLL_TIMEOUT_MS: 1000
      LOG_BUFFER_SIZE: 500
      BATCH_INTERVAL_SECONDS: 900
      BATCH_WINDOW_EVENTS: 1200
      BATCH_USE_PYSPARK: "true"
      BATCH_RUN_LOOP: "true"
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv sync &&
      uv run logpulse-runner --mode batch --batch-loop"

  frontend:
    image: oven/bun:1
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_BASE_URL: ws://localhost:8000
    command: >
      sh -c "bun install &&
      bun run dev --host 0.0.0.0 --port 5173"

volumes:
  pg_data:
  es_data: